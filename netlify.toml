[build]
  command = "npm run build"
  # Nitro's netlify preset puts the static assets in dist/ and writes the SSR
  # handler to .netlify/functions-internal/server, which Netlify picks up on its
  # own (path "/*", preferStatic). Nothing else needs wiring here.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

  # The Firebase web config is public by design and Vite inlines it into the
  # client bundle, so secret scanning would find it in dist/ and fail the build.
  # Security for these comes from firestore.rules and storage.rules, not secrecy.
  # Only these six are omitted — FIREBASE_SERVICE_ACCOUNT, FIREBASE_SA_* and the
  # LINE secrets stay scanned, and must never appear in build output.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"
